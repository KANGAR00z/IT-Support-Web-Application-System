<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FAST TICKET - ประวัติการแจ้งซ่อม</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <!-- เปิดการเชื่อมต่อไป GAS ล่วงหน้าระหว่างรอ LIFF init (คำขอแรกเร็วขึ้น) · crossorigin: fetch ไม่ส่ง cookie
       ต้องใช้ connection แบบ anonymous ไม่งั้น preconnect เปล่าประโยชน์ -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="config.js"></script>
  <script src="common.js"></script>

  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
    @media (max-width: 767px) {
      input, select, textarea { font-size: 16px !important; }
    }
    .safe-b { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .app-w { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
    .status-open { background: #fef3c7; color: #92400e; }
    .status-prog { background: #dbeafe; color: #1e40af; }
    .status-done { background: #d1fae5; color: #065f46; }
    .status-cancel { background: #f1f5f9; color: #64748b; text-decoration: line-through; }
    /* ตัวเลขสรุปกดเพื่อกรองได้ — ตัวที่เลือกอยู่มีกรอบสีแบรนด์ */
    .kpi-tile[aria-pressed="true"] { border-color: var(--brand-500); box-shadow: 0 0 0 1px var(--brand-500); }
  </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden">

  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between gap-2 z-10 shrink-0 shadow-sm">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-8 h-8 rounded-lg bg-brand-600 text-white font-bold flex items-center justify-center shrink-0 text-sm">F</div>
      <div class="font-bold text-base text-slate-800 truncate">ประวัติการแจ้งซ่อม</div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="refreshBtn" title="โหลดใหม่" aria-label="โหลดใหม่" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-slate-100 active:bg-slate-200 text-slate-500"><span data-icon="refresh-cw" data-icon-class="w-5 h-5"></span></button>
      <div class="flex items-center gap-2 bg-slate-100 rounded-full pl-1.5 pr-1.5 min-[400px]:pr-2.5 py-1.5 min-h-[40px]">
        <span class="w-7 h-7 rounded-full bg-brand-600 text-white text-xs flex items-center justify-center shrink-0 overflow-hidden" id="userAvatar">?</span>
        <span id="userName" class="hidden min-[400px]:inline text-slate-600 text-sm font-medium truncate max-w-[6rem]">...</span>
      </div>
    </div>
  </header>

  <div id="loading" class="flex-1 overflow-hidden" role="status" aria-label="กำลังโหลดข้อมูล">
    <div class="app-w px-3 py-4 space-y-2.5">
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-white rounded-xl p-3 border border-slate-100 space-y-2 flex flex-col items-center"><div class="animate-pulse bg-slate-200 rounded h-3 w-16"></div><div class="animate-pulse bg-slate-200 rounded h-5 w-6"></div></div>
        <div class="bg-white rounded-xl p-3 border border-slate-100 space-y-2 flex flex-col items-center"><div class="animate-pulse bg-slate-200 rounded h-3 w-16"></div><div class="animate-pulse bg-slate-200 rounded h-5 w-6"></div></div>
        <div class="bg-white rounded-xl p-3 border border-slate-100 space-y-2 flex flex-col items-center"><div class="animate-pulse bg-slate-200 rounded h-3 w-16"></div><div class="animate-pulse bg-slate-200 rounded h-5 w-6"></div></div>
      </div>
      <div class="bg-white rounded-xl border border-slate-100 p-4 space-y-2.5"><div class="flex justify-between"><div class="animate-pulse bg-slate-200 rounded h-4 w-16"></div><div class="animate-pulse bg-slate-200 rounded h-4 w-14"></div></div><div class="animate-pulse bg-slate-200 rounded h-3 w-full"></div><div class="animate-pulse bg-slate-200 rounded h-3 w-2/3"></div><div class="pt-1"><div class="animate-pulse bg-slate-200 rounded h-3 w-24"></div></div></div><div class="bg-white rounded-xl border border-slate-100 p-4 space-y-2.5"><div class="flex justify-between"><div class="animate-pulse bg-slate-200 rounded h-4 w-16"></div><div class="animate-pulse bg-slate-200 rounded h-4 w-14"></div></div><div class="animate-pulse bg-slate-200 rounded h-3 w-full"></div><div class="animate-pulse bg-slate-200 rounded h-3 w-2/3"></div><div class="pt-1"><div class="animate-pulse bg-slate-200 rounded h-3 w-24"></div></div></div><div class="bg-white rounded-xl border border-slate-100 p-4 space-y-2.5"><div class="flex justify-between"><div class="animate-pulse bg-slate-200 rounded h-4 w-16"></div><div class="animate-pulse bg-slate-200 rounded h-4 w-14"></div></div><div class="animate-pulse bg-slate-200 rounded h-3 w-full"></div><div class="animate-pulse bg-slate-200 rounded h-3 w-2/3"></div><div class="pt-1"><div class="animate-pulse bg-slate-200 rounded h-3 w-24"></div></div></div>
    </div>
  </div>

  <div id="loginScreen" class="hidden flex-1 flex flex-col items-center justify-center p-10 text-center">
    <div class="w-16 h-16 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center mb-4"><span data-icon="lock" data-icon-class="w-8 h-8"></span></div>
    <div class="text-slate-700 font-bold text-lg mb-1">เข้าสู่ระบบด้วย LINE</div>
    <div class="text-slate-400 text-sm mb-6">กรุณาล็อกอินเพื่อดูประวัติการแจ้งซ่อมของคุณ</div>
    <button id="loginBtn" class="bg-[#06C755] text-white px-8 py-3 rounded-xl font-bold text-base hover:bg-[#05b04c] active:bg-[#049a42] shadow-md flex items-center gap-2">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.94 2 10.7c0 2.66 1.46 5.03 3.77 6.65l-.97 3.56c-.07.26.23.47.46.32l4.13-2.48c.84.15 1.71.25 2.61.25 5.52 0 10-3.94 10-8.7S17.52 2 12 2z"/></svg>
      LINE Login
    </button>
    <div class="text-slate-400 text-xs mt-4">หรือเปิดผ่านแอป LINE เพื่อเข้าใช้งานอัตโนมัติ</div>
  </div>

  <!-- โหลดไม่สำเร็จ: ไอคอน + สาเหตุ + คำแนะนำ ตามประเภทปัญหา (ftErrorState ใน common.js — ชุดเดียวกับหน้า admin) -->
  <div id="errorBox" class="hidden flex-1 overflow-y-auto">
    <div id="errorState" class="app-w px-4"></div>
  </div>

  <div id="content" class="hidden flex-1 overflow-y-auto">
    <div class="app-w px-3 py-4 space-y-2.5">

      <!-- กำลังอัปเดต / อัปเดตไม่สำเร็จ ขณะโชว์ข้อมูลที่จำไว้ในเครื่อง — กดเพื่อลองใหม่ -->
      <button id="staleBar" type="button" class="hidden w-full text-left text-xs rounded-lg px-3 py-2 flex items-center gap-2 border">
        <span id="staleIcon" class="shrink-0"></span><span id="staleText" class="min-w-0"></span>
      </button>

      <!-- กดตัวเลขเพื่อดูเฉพาะสถานะนั้น (กดซ้ำ = ดูทั้งหมด) -->
      <div class="grid grid-cols-3 gap-2" role="group" aria-label="กรองตามสถานะ">
        <button type="button" data-status="1" aria-pressed="false" class="kpi-tile bg-white rounded-xl p-3 text-center border border-slate-100 transition-shadow">
          <div class="text-xs text-amber-700 font-medium">รอรับเรื่อง</div>
          <div id="kpiOpen" class="text-xl font-bold text-slate-800 mt-0.5">0</div>
        </button>
        <button type="button" data-status="2" aria-pressed="false" class="kpi-tile bg-white rounded-xl p-3 text-center border border-slate-100 transition-shadow">
          <div class="text-xs text-blue-700 font-medium">กำลังดำเนินการ</div>
          <div id="kpiProg" class="text-xl font-bold text-slate-800 mt-0.5">0</div>
        </button>
        <button type="button" data-status="3" aria-pressed="false" class="kpi-tile bg-white rounded-xl p-3 text-center border border-slate-100 transition-shadow">
          <div class="text-xs text-emerald-700 font-medium">เสร็จสิ้น</div>
          <div id="kpiDone" class="text-xl font-bold text-slate-800 mt-0.5">0</div>
        </button>
      </div>

      <div id="filterNote" class="hidden flex items-center justify-between gap-2 text-sm text-slate-600 px-1">
        <span id="filterText"></span>
        <button type="button" id="filterClear" class="text-brand-700 font-medium px-2 min-h-[36px]">ดูทั้งหมด</button>
      </div>

      <div id="ticketList" class="space-y-2.5"></div>

      <div id="emptyState" class="hidden py-12 text-center">
        <div class="w-14 h-14 mx-auto rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mb-3"><span data-icon="inbox" data-icon-class="w-7 h-7"></span></div>
        <div class="text-slate-500 text-sm">ยังไม่มีประวัติการแจ้งซ่อม</div>
        <div class="text-slate-400 text-xs mt-1">เมื่อคุณแจ้งซ่อม รายการจะปรากฏที่นี่</div>
      </div>

    </div>
  </div>

  <!-- แจ้งซ่อมเรื่องใหม่ได้จากหน้านี้เลย (เดิมต้องออกไปหาที่ Rich Menu) -->
  <div id="newBar" class="bg-white border-t border-slate-100 px-4 pt-3 shrink-0 shadow-[0_-4px_15px_rgba(0,0,0,0.05)] safe-b">
    <div class="app-w pb-3">
      <a id="newTicketLink" href="index.html" class="w-full bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-bold text-base rounded-xl flex items-center justify-center gap-2 min-h-[52px]">
        <span data-icon="plus" data-icon-class="w-5 h-5"></span>แจ้งซ่อมใหม่
      </a>
    </div>
  </div>

  <div id="pdfModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-none sm:rounded-xl w-full max-w-3xl h-[100dvh] sm:h-[85dvh] flex flex-col overflow-hidden shadow-2xl">
      <div class="flex items-center justify-between gap-2 px-3 sm:px-4 py-3 border-b border-slate-200">
        <div class="font-bold flex items-center gap-2 min-w-0"><span data-icon="file-text" data-icon-class="w-5 h-5 text-slate-500"></span> <span id="pdfTitle" class="truncate">เอกสาร</span></div>
        <div class="flex items-center gap-1 shrink-0">
          <a id="pdfOpen" target="_blank" class="text-sm text-brand-600 hover:underline px-2 py-2 inline-flex items-center gap-1">เปิดแท็บใหม่<span data-icon="external-link" data-icon-class="w-3.5 h-3.5"></span></a>
          <button id="pdfClose" class="text-slate-400 hover:text-slate-700 leading-none w-10 h-10 flex items-center justify-center" aria-label="ปิด"><span data-icon="x" data-icon-class="w-6 h-6"></span></button>
        </div>
      </div>
      <iframe id="pdfFrame" class="flex-1 w-full bg-slate-100" src=""></iframe>
    </div>
  </div>

  <script>
    const STATUS = { OPEN: 1, IN_PROGRESS: 2, CLOSED: 3 };
    const STATUS_LABEL = {
      1: { text: 'รอรับเรื่อง', cls: 'status-open' },
      2: { text: 'กำลังดำเนินการ', cls: 'status-prog' },
      3: { text: 'เสร็จสิ้น', cls: 'status-done' }
    };
    // Admin ยกเลิกงาน (soft delete) — แสดงไว้ ไม่ให้งานของผู้แจ้งหายเงียบๆ
    const CANCELLED_LABEL = { text: 'ยกเลิกแล้ว', cls: 'status-cancel' };

    const catColor = (c) => ({
      'ฮาร์ดแวร์':'bg-red-100 text-red-700',
      'ซอฟต์แวร์':'bg-blue-100 text-blue-700',
      'เครือข่าย':'bg-purple-100 text-purple-700'
    }[c] || 'bg-slate-100 text-slate-600');

    let myTickets = [];
    let expandedId = null;
    let statusFilter = 0;   // 0 = ทั้งหมด · 1/2/3 = เฉพาะสถานะนั้น (กดที่ตัวเลขสรุป)

    // งานที่ยังไม่เสร็จขึ้นก่อน (คนเปิดหน้านี้ส่วนใหญ่มาตามงานค้าง) -> เสร็จแล้ว -> ยกเลิก · ในกลุ่มเดียวกันใหม่สุดก่อน
    const rankOf = (t) => t.cancelled ? 3 : (t.status === STATUS.CLOSED ? 2 : 1);
    const byRelevance = (a, b) => rankOf(a) - rankOf(b) || (parseT(b.createdAt) || 0) - (parseT(a.createdAt) || 0) || b.id - a.id;

    // แถบความคืบหน้า 3 ขั้น — สีตามสถานะปัจจุบัน
    const STEP_COLOR = { 1: 'bg-amber-400', 2: 'bg-blue-500', 3: 'bg-emerald-500' };
    function stepper(t) {
      if (t.cancelled) return '';
      const at = STATUS_LABEL[t.status] ? t.status : STATUS.OPEN;
      return `<ol class="mt-2.5 flex gap-1.5" aria-label="ความคืบหน้า: ${STATUS_LABEL[at].text}">` +
        ['แจ้งแล้ว', 'รับเรื่อง', 'เสร็จสิ้น'].map((s, i) => `
          <li class="flex-1 min-w-0">
            <div class="h-1.5 rounded-full ${i < at ? STEP_COLOR[at] : 'bg-slate-200'}"></div>
            <div class="mt-1 text-xs truncate ${i < at ? 'text-slate-600 font-medium' : 'text-slate-400'}">${s}</div>
          </li>`).join('') + '</ol>';
    }
    const detailRow = (label, value) => value
      ? `<div class="flex gap-2 text-sm"><span class="text-slate-500 shrink-0 w-24">${label}</span><span class="text-slate-700 min-w-0 break-words">${value}</span></div>` : '';

    const callBackend = (action, data) => ftCallBackend(action, data);

    // e = Error จาก ftCallBackend (มีประเภทติดมา) หรือข้อความ (ปัญหาตอนเริ่ม LIFF)
    function showError(e) {
      if (!(e instanceof Error)) e = new Error(String(e || ''));
      $('loading').classList.add('hidden');
      $('content').classList.add('hidden');
      $('errorBox').classList.remove('hidden');
      setStale(null);
      ftErrorState($('errorState'), e, {
        onRetry: e.ftKind === 'liff' ? () => location.reload() : loadTickets,
        onLogin: () => ftRelogin(true),
        lineId: ownerId,
        where: 'ประวัติการแจ้งซ่อม (ผู้แจ้ง)',
      });
    }

    /* ---------- แคชในเครื่อง (stale-while-revalidate) ----------
       GAS ตอบช้าคงที่ ~1.5-3 วิ ต่อครั้ง (ก่อนแตะ DB ด้วยซ้ำ) -> เปิดหน้าแล้วจอว่างทุกครั้ง
       จึงโชว์ผลครั้งก่อนทันที แล้วดึงของใหม่มาทับเบื้องหลัง พร้อมบอกชัดว่ากำลังอัปเดต
       ผูกกับ LINE userId — เครื่องที่ใช้ร่วมกันจะไม่เห็นประวัติของคนอื่น */
    const MY_CACHE_KEY = 'ft_my_tickets_v2';
    let ownerId = '';
    let loadingNow = false;

    function readMyCache() {
      try {
        const o = JSON.parse(localStorage.getItem(MY_CACHE_KEY) || 'null');
        return (o && ownerId && o.owner === ownerId && Array.isArray(o.tickets)) ? o : null;
      } catch (e) { return null; }
    }
    function writeMyCache(list) {
      try { localStorage.setItem(MY_CACHE_KEY, JSON.stringify({ owner: ownerId, savedAt: Date.now(), tickets: list })); } catch (e) {}
    }
    function showContent() {
      $('loading').classList.add('hidden');
      $('errorBox').classList.add('hidden');
      $('content').classList.remove('hidden');
    }
    // kind: 'sync' = กำลังอัปเดต (โชว์ข้อมูลที่จำไว้ระหว่างรอ) · null = ซ่อน
    // อัปเดตไม่สำเร็จไม่ใช้แถบนี้ — ขึ้นหน้าสถานะแทน (ข้อมูลเก่าอาจทำให้เข้าใจผิดว่าเป็นปัจจุบัน)
    function setStale(kind, text) {
      const bar = $('staleBar');
      bar.classList.toggle('hidden', !kind);
      if (!kind) return;
      bar.className = 'w-full text-left text-xs rounded-lg px-3 py-2 flex items-center gap-2 border bg-brand-50 border-brand-100 text-brand-700';
      $('staleIcon').innerHTML = icon('refresh-cw', 'w-3.5 h-3.5 animate-spin');
      $('staleText').innerText = text;
    }

    async function loadTickets() {
      if (loadingNow) return;   // กดรีเฟรชรัวๆ ไม่ยิงซ้อน
      loadingNow = true;
      $('refreshBtn').classList.add('animate-spin');
      const cached = readMyCache();
      if (cached) {
        myTickets = cached.tickets;
        renderTickets();
        showContent();
        setStale('sync', 'กำลังอัปเดต… ที่เห็นอยู่คือข้อมูลเมื่อ ' + timeAgo(new Date(cached.savedAt).toISOString()));
      } else if ($('content').classList.contains('hidden')) {
        $('loading').classList.remove('hidden');
        $('errorBox').classList.add('hidden');
      }
      try {
        const res = await callBackend('getMyTickets', {});
        if (!res || res.status !== 'success') throw new Error((res && res.message) || 'โหลดไม่สำเร็จ');
        // DB เก็บ "ฮาร์ดแวร์ (Hardware)" — ตัดส่วนท้ายให้ตรงคีย์สีของ catColor เหมือน admin.js
        myTickets = (res.tickets || []).map(t => ({ ...t, category: cleanCategory(t.category || '') }));
        writeMyCache(myTickets);
        renderTickets();
        showContent();
        setStale(null);
      } catch (e) {
        // หน้าสถานะแทนเสมอ แม้มีของที่จำไว้ (ข้อมูลเก่าอาจทำให้เข้าใจผิดว่าสถานะเป็นปัจจุบัน)
        showError(e);
      } finally {
        loadingNow = false;
        $('refreshBtn').classList.remove('animate-spin');
      }
    }

    function renderTickets() {
      const live = myTickets.filter(t => !t.cancelled);   // งานที่ถูกยกเลิกไม่นับในตัวเลขสรุป
      const count = (s) => live.filter(t => t.status === s).length;
      $('kpiOpen').innerText = count(STATUS.OPEN);
      $('kpiProg').innerText = count(STATUS.IN_PROGRESS);
      $('kpiDone').innerText = count(STATUS.CLOSED);
      document.querySelectorAll('.kpi-tile').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.status === statusFilter)));

      const shown = myTickets.filter(t => !statusFilter || (!t.cancelled && t.status === statusFilter)).sort(byRelevance);
      $('filterNote').classList.toggle('hidden', !statusFilter);
      if (statusFilter) $('filterText').innerText = 'แสดงเฉพาะ "' + STATUS_LABEL[statusFilter].text + '" · ' + shown.length + ' รายการ';

      const list = $('ticketList');
      list.innerHTML = '';
      $('emptyState').classList.toggle('hidden', myTickets.length > 0);
      if (myTickets.length && !shown.length) {
        list.innerHTML = '<div class="py-8 text-center text-sm text-slate-500">ไม่มีรายการในสถานะนี้</div>';
      }

      shown.forEach(t => {
        const st = t.cancelled ? CANCELLED_LABEL : (STATUS_LABEL[t.status] || STATUS_LABEL[1]);
        const isExpanded = expandedId === t.id;

        const el = document.createElement('div');
        el.className = 'bg-white rounded-xl border border-slate-100 overflow-hidden shadow-sm';

        let detailHtml = '';
        if (isExpanded) {
          const thumb = ftDriveThumb(t.imageUrl, 600);
          detailHtml = `
            <div id="tk-detail-${t.id}" class="px-4 pb-4 space-y-2 border-t border-slate-100 pt-3">
              ${detailRow('แจ้งเมื่อ', escapeHtml(ftDate(t.createdAt)))}
              ${detailRow('รับเรื่องเมื่อ', t.acceptedAt ? escapeHtml(ftDate(t.acceptedAt)) + (t.assignee ? ' · ' + escapeHtml(t.assignee) : '') : '')}
              ${detailRow('เสร็จเมื่อ', t.closedAt ? escapeHtml(ftDate(t.closedAt)) : '')}
              ${!t.acceptedAt ? detailRow('ผู้รับผิดชอบ', t.assignee ? escapeHtml(t.assignee) : '') : ''}
              ${detailRow('สังกัด', escapeHtml(t.branch || t.office || ''))}
              ${detailRow('ส่วน', escapeHtml(t.department || ''))}
              ${t.resolution ? `
                <div class="pt-1">
                  <div class="text-sm text-slate-500 mb-1">วิธีแก้ไข</div>
                  <div class="text-sm text-slate-700 bg-emerald-50 rounded-lg px-3 py-2 whitespace-pre-wrap">${escapeHtml(t.resolution)}</div>
                </div>` : ''}
              ${thumb ? `
                <a href="${escapeHtml(t.imageUrl)}" target="_blank" rel="noopener" class="block pt-1 space-y-1.5">
                  <img src="${escapeHtml(thumb)}" alt="รูปที่แนบตอนแจ้ง" loading="lazy" onerror="this.remove()" class="w-full max-h-56 object-cover rounded-lg border border-slate-200 bg-slate-100">
                  <span class="inline-flex items-center gap-1.5 text-sm text-brand-700">${icon('camera', 'w-4 h-4')}รูปที่แนบตอนแจ้ง · เปิดดู${icon('external-link', 'w-3.5 h-3.5')}</span>
                </a>` : ''}
              ${t.pdfUrl ? `<button type="button" data-pdf="${t.id}" class="mt-1 inline-flex items-center gap-1.5 text-sm font-medium text-brand-700 bg-brand-50 hover:bg-brand-100 rounded-lg px-3 min-h-[40px]">${icon('file-text', 'w-4 h-4')}ดูเอกสาร</button>` : ''}
            </div>`;
        }

        el.innerHTML = `
          <button type="button" class="ticket-header w-full text-left px-4 py-3 active:bg-slate-50 transition-colors" aria-expanded="${isExpanded}" ${isExpanded ? `aria-controls="tk-detail-${t.id}"` : ''}>
            <div class="flex items-start justify-between gap-2 mb-1.5">
              <div class="flex items-center gap-2 flex-wrap min-w-0">
                <span class="font-bold text-sm text-slate-800">${escapeHtml(t.code)}</span>
                ${t.category ? `<span class="text-xs px-2 py-0.5 rounded-full ${catColor(t.category)}">${escapeHtml(t.category)}</span>` : ''}
                ${t.imageUrl ? `<span class="text-slate-400" title="มีรูปแนบ">${icon('camera', 'w-3.5 h-3.5')}</span>` : ''}
              </div>
              <span class="text-xs px-2 py-0.5 rounded-full shrink-0 font-medium ${st.cls}">${st.text}</span>
            </div>
            <p class="text-sm text-slate-600 leading-snug ${isExpanded ? '' : 'line-clamp-2'}">${escapeHtml(t.detail)}</p>
            ${stepper(t)}
            <div class="text-xs text-slate-500 mt-2 flex items-center gap-1">
              ${icon('clock', 'w-3.5 h-3.5')} แจ้งเมื่อ ${escapeHtml(ftWhen(t.createdAt))}
              <span class="ml-auto inline-flex items-center gap-0.5 text-slate-500">${isExpanded ? 'ย่อ' : 'รายละเอียด'}${icon('chevron-up', 'w-4 h-4 transition-transform ' + (isExpanded ? '' : 'rotate-180'))}</span>
            </div>
          </button>
          ${detailHtml}
        `;

        el.querySelector('.ticket-header').addEventListener('click', () => {
          expandedId = expandedId === t.id ? null : t.id;
          renderTickets();
        });

        const pdfBtn = el.querySelector('[data-pdf]');
        if (pdfBtn) pdfBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openPdf(t);
        });

        list.appendChild(el);
      });
    }

    document.querySelectorAll('.kpi-tile').forEach(b => b.addEventListener('click', () => {
      const s = +b.dataset.status;
      statusFilter = statusFilter === s ? 0 : s;
      renderTickets();
    }));
    $('filterClear').addEventListener('click', () => { statusFilter = 0; renderTickets(); });

    function openPdf(t) {
      if (!t.pdfUrl) return;
      const preview = t.pdfUrl.replace('/view?usp=drivesdk', '/preview').replace('/view', '/preview');
      $('pdfTitle').innerText = t.code;
      $('pdfFrame').src = preview;
      $('pdfOpen').href = t.pdfUrl;
      $('pdfModal').classList.remove('hidden');
    }
    function closePdf() { $('pdfModal').classList.add('hidden'); $('pdfFrame').src = ''; }
    $('pdfClose').addEventListener('click', closePdf);
    $('pdfModal').addEventListener('click', (e) => { if (e.target === $('pdfModal')) closePdf(); });
    $('refreshBtn').addEventListener('click', loadTickets);
    $('staleBar').addEventListener('click', loadTickets);
    // เน็ตกลับมาระหว่างค้างอยู่ที่หน้าสถานะ -> ลองใหม่เอง (ตามที่หน้าสถานะบอกผู้ใช้ไว้)
    window.addEventListener('online', () => { if (!$('errorBox').classList.contains('hidden')) loadTickets(); });

    // LIFF -> LIFF ต้องผ่าน liff.line.me ไม่งั้นหน้าฟอร์มได้ token ของ LIFF app ตัวนี้แทน
    $('newTicketLink').href = MY_LIFF_ID ? 'https://liff.line.me/' + MY_LIFF_ID : 'index.html';

    function showLogin() {
      $('newBar').classList.add('hidden');
      $('loading').classList.add('hidden');
      $('content').classList.add('hidden');
      $('errorBox').classList.add('hidden');
      $('loginScreen').classList.remove('hidden');
    }

    $('loginBtn').addEventListener('click', () => { liff.login(); });

    async function init() {
      try {
        await liff.init({ liffId: HISTORY_LIFF_ID || MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          // ในแอป LINE login อัตโนมัติตอน init เสมอ — ถ้าไม่ แปลว่าเปิดผ่าน LIFF app ตัวอื่น
          // และ liff.login() ใช้ในแอป LINE ไม่ได้ (ค้างหน้าโหลดตลอด) จึงบอกสาเหตุแทน
          if (liff.isInClient()) showError(ftErr('LIFF ID ไม่ตรงกับ LIFF app ที่เปิดหน้านี้ — ตรวจ HISTORY_LIFF_ID ใน config.js', 'liff'));
          else showLogin();
          return;
        }

        if (!liff.getIDToken()) {
          showError(ftErr('ไม่ได้ ID Token — LIFF ID ใน config.js อาจไม่ตรงกับ LIFF app ที่เปิดหน้านี้', 'liff'));
          return;
        }

        const tok = liff.getDecodedIDToken() || {};
        ownerId = tok.sub || '';
        // เริ่มโหลดประวัติทันที ไม่ต้องรอ getProfile (คนละ request กัน รอต่อกันเสียเวลาเปล่า)
        const ticketsP = loadTickets();

        // getProfile ต้องมี scope "profile" — ถ้าไม่มี ใช้ชื่อจาก ID Token แทน ไม่ให้ทั้งหน้าพัง
        let profile = null;
        try { profile = await liff.getProfile(); } catch (e) { console.warn('getProfile:', e.message); }
        const name = (profile && profile.displayName) || tok.name || 'ผู้ใช้ LINE';
        const pic = (profile && profile.pictureUrl) || tok.picture || '';
        $('userName').innerText = name;
        if (pic) {
          $('userAvatar').innerHTML = '<img src="' + escapeHtml(pic) + '" alt="" class="w-full h-full rounded-full object-cover">';
        } else {
          $('userAvatar').innerText = name.charAt(0);
        }

        await ticketsP;
      } catch (e) {
        showError(ftErr('liff.init: ' + e.message, 'liff'));
      }
    }
    init();
  </script>
</body>
</html>
